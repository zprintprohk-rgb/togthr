name = "togthr-life"
account_id = "32c174efaa22353f357c0fdff9d61b86"
main = ".open-next/worker.js"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

# ─── Non-sensitive env vars (production defaults) ────────────────────────
# Sensitive vars (SUPABASE_SERVICE_ROLE_KEY, PAYPAL_CLIENT_SECRET, ALIPAY_*_KEY, etc.)
# are set via CLI: npx wrangler secret put <KEY>
# Source of truth: .env.production (not committed; do NOT commit anon key)
[vars]
NEXT_PUBLIC_SITE_URL = "https://togthr.life"
NEXTJS_ENV = "production"
PAYPAL_MODE = "live"
# Public Supabase (anon key is safe to inline into client bundle)
NEXT_PUBLIC_SUPABASE_URL = "https://pcgwvqpzyqijrvikfawd.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_aDkUMB90QwGQAlcWAGT5Eg_Wf9o_Z69"
# Public R2 CDN (safe to inline)
# NOTE: If R2 public subdomain is enabled, use:
# NEXT_PUBLIC_CDN_URL = "https://togthr-images.32c174efaa22353f357c0fdff9d61b86.r2.dev"
# Falls back to NEXT_PUBLIC_SITE_URL in lib/r2.ts — safe to leave unset
NEXT_PUBLIC_CDN_URL = ""
# PayPal client ID is technically public (used in browser SDK), kept here for convenience
PAYPAL_CLIENT_ID = ""
ALIPAY_APP_ID = ""
# VAPID public key is public (browser push subscription needs it)
VAPID_PUBLIC_KEY = ""
# CRON_SECRET — protects /api/cron/* endpoints. Set via: npx wrangler secret put CRON_SECRET
CRON_SECRET = ""

# Cron trigger: daily UTC 0:00 to check expired subscriptions
[triggers]
crons = ["0 0 * * *"]

# Static assets (OpenNext auto-generates .open-next/assets/)
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# R2 bucket (togthr-images — for skin sprites, capsule media, sticker PNGs)
[[r2_buckets]]
binding = "R2"
bucket_name = "togthr-images"
